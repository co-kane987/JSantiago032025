<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fixed Menu</title>
<style>
html{height:200%}
body{background-color:rgb(104, 49, 67);margin:0;font-family:Arial,Helvetica,sans-serif}
#pageheader{background-color:rgb(219, 145, 145);padding:1rem;position:static}
img#logo{width:100px;height:100px;display:block;margin:auto}
#pageheader h1{color:rgb(139, 151, 227);text-align:center;background-color:snow}
#pageheader nav{background-color:pink;padding:.5rem;border-radius:10px}
#pageheader ul{background-color:rgb(183, 51, 95);padding:.5rem;list-style-type:none;display:flex;flex-direction:column;gap:.5rem}
#pageheader li{text-align:center;padding:1rem;background-color:rgb(223,151,175);border:1px solid snow}
#pageheader a{color:rgb(49, 50, 99);text-decoration:none}
main{padding:1rem}
h2{color:snow}
p{line-height:1.5;color:#333}
@media screen and (min-width:650px){body{background-color:peachpuff}#pageheader{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center}#fblogoheader{display:flex;align-items:center;gap:1rem}#pageheader nav{min-width:400px}#pageheader ul{flex-direction:row;justify-content:center}main{padding-top:200px}}
</style>
</head>
<body>
<header id="pageheader">
<div id="fblogoheader">
<img id="logo" src="paws_logo.png" alt="Paws Logo"/>
<h1>Paws and Whiskers</h1>
</div>
<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Our pets</a></li>
<li><a href="#">Testimonials</a></li>
<li><a href="#">About Us</a></li>
</ul>
</nav>
</header>
<main>
<h2>Fixed Menu</h2>
<p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
</main>
</body>
</html>
